<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工时榨汁机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: one narrow job-ticket column. Inputs first; the checklist's navy header bar carries the answer; the break table below doubles as the ledger. */
:root {
  --bg: #0e141c;
  --surface: #172030;
  --ink: #e5eaf1;
  --muted: #9aa7b8;
  --faint: #5c6a7d;
  --line: #273347;
  --field-line: #3a4a60;
  --accent: #86aee6;
  --on-accent: #0e141c;
  --band: #1f3556;
  --band-ink: #f2f5f9;
  --band-muted: #a9bbd3;
  --deduct: #e0b25a;
  --warn: #f08a5d;
  --focus: #86aee6;
  --knob: #e5eaf1;
  --font-num: "Barlow Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-ui: "Barlow", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 440px; margin: 0 auto; display: grid; gap: 14px; }
.head h1 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.sub { margin: 6px 0 0; font-size: 15px; line-height: 1.55; color: var(--muted); }

.card, .ledger { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.card { padding: 2px 14px 14px; }
.row {
  display: grid;
  grid-template-columns: 50px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding-block: 12px;
  border-bottom: 1px solid var(--line);
}
.lab { font-size: 16px; font-weight: 700; line-height: 1.2; }
.en {
  display: block;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
}
.time {
  width: 100%;
  min-width: 0;
  height: 54px;
  padding: 0 12px;
  font-family: var(--font-num);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--field-line);
  border-radius: 8px;
  -webkit-appearance: none;
  appearance: none;
}
.time::placeholder { color: var(--faint); }
.time:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.time[aria-invalid="true"] { border-color: var(--warn); outline-color: var(--warn); }

button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.now {
  height: 54px;
  min-width: 64px;
  padding: 0 14px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.15;
}
.now .en { color: inherit; opacity: .72; }
.now:active, .fix:active { transform: translateY(1px); }
.now:focus-visible, .fix:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.switch {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 14px;
  cursor: pointer;
}
.sw-text { font-size: 16px; font-weight: 700; line-height: 1.2; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.track {
  flex: none;
  position: relative;
  width: 50px;
  height: 30px;
  border-radius: 15px;
  background: var(--field-line);
  transition: background-color .15s ease;
}
.track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--knob);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  transition: transform .15s ease;
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(20px); }
.switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }

.band {
  background: var(--band);
  color: var(--band-ink);
  border-radius: 12px;
  padding: 14px 16px 16px;
}
.band-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.band-lab { font-size: 14px; font-weight: 700; }
.band-lab .en { display: inline; margin-left: 6px; color: var(--band-muted); }
.chip {
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid var(--band-muted);
  color: var(--band-muted);
}
.big { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
#net {
  font-family: var(--font-num);
  font-size: 80px;
  font-weight: 800;
  line-height: .95;
  letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
}
.unit { font-size: 16px; font-weight: 700; color: var(--band-muted); }
.line { margin: 8px 0 0; font-size: 15px; color: var(--band-muted); font-variant-numeric: tabular-nums; }
.line-en { margin: 2px 0 0; font-size: 13px; color: var(--band-muted); font-variant-numeric: tabular-nums; }
.line-en:empty { display: none; }
.unit .en { color: var(--band-muted); }
.ledger-head .r { text-align: right; }
.ledger-head .en, .n .en { margin-top: 1px; }
.fix {
  margin-top: 10px;
  padding: 10px 16px;
  border: 0;
  border-radius: 8px;
  background: var(--band-ink);
  color: var(--band);
  font-size: 15px;
  font-weight: 700;
}

.ledger { padding: 12px 14px 4px; }
.ledger-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.ledger h2 { margin: 0; font-size: inherit; font-weight: inherit; }
.ledger ul { list-style: none; margin: 4px 0 0; padding: 0; }
.ledger li {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 10px;
  padding-block: 9px;
  border-top: 1px solid var(--line);
}
.t { font-family: var(--font-num); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.n { font-size: 14px; color: var(--muted); min-width: 0; }
.v {
  font-family: var(--font-num);
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: right;
  color: var(--deduct);
}
li.off .t { color: var(--muted); }
li.off .v { color: var(--faint); font-weight: 500; }

.foot { margin: 0; padding-inline: 2px; font-size: 12.5px; color: var(--muted); }

/* 改休息时间：就在休息表里原地改，不另开页面 */
.ghost {
  height: 40px;
  padding: 0 14px;
  border: 1px solid var(--field-line);
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
  font-size: 15px;
  font-weight: 700;
}
.ghost .en { display: inline; margin-left: 6px; color: var(--muted); }
.ghost:active, .done:active, .del:active { transform: translateY(1px); }
.ghost:focus-visible, .done:focus-visible, .del:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.edit-bar { border-top: 1px solid var(--line); padding: 10px 0; }
.edit-bar .ghost { width: 100%; }
.ledger.editing .r { visibility: hidden; }
.ledger li.ed {
  grid-template-columns: 68px auto 68px minmax(0, 1fr) 34px;
  align-items: center;
  gap: 6px;
  padding-block: 8px;
}
.time.sm { height: 40px; padding: 0 2px; font-size: 21px; text-align: center; border-radius: 6px; }
.name {
  width: 100%;
  min-width: 0;
  height: 40px;
  padding: 0 8px;
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--field-line);
  border-radius: 6px;
}
.name:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.dash { color: var(--muted); }
.del {
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 24px;
  line-height: 1;
}
.editor { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 12px; }
.shift { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.shift label { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
.ed-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.ed-btns .ghost { padding: 0 6px; }
.done {
  height: 40px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 15px;
  font-weight: 700;
}
.ed-note { margin: 0; font-size: 12.5px; color: var(--muted); }
.ed-note.bad { color: var(--warn); }

@media (prefers-reduced-motion: reduce) {
  .track, .track::after { transition: none; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1>工时榨汁机</h1>
    <p class="sub">智商欠费算盘精，鸡毛蒜皮当圣经。<br>抹去凡间烟火气，灵长动物化肉身。</p>
  </header>

  <section class="card" aria-label="开工和收工时间">
    <div class="row">
      <label class="lab" for="start">开始<span class="en">Start</span></label>
      <input class="time" id="start" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="5" placeholder="830" enterkeyhint="next" aria-describedby="line">
      <button class="now" type="button" data-for="start">现在<span class="en">Now</span></button>
    </div>
    <div class="row">
      <label class="lab" for="end">结束<span class="en">End</span></label>
      <input class="time" id="end" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="5" placeholder="1321" enterkeyhint="done" aria-describedby="line">
      <button class="now" type="button" data-for="end">现在<span class="en">Now</span></button>
    </div>
    <label class="switch" for="next">
      <span class="sw-text">次日结束<span class="en">Ends next day</span></span>
      <input id="next" type="checkbox" role="switch">
      <span class="track" aria-hidden="true"></span>
    </label>
  </section>

  <section class="band" aria-live="polite">
    <div class="band-top">
      <span class="band-lab">实际换型时间<span class="en">Actual CO time</span></span>
      <span class="chip" id="chip" hidden>示例 EXAMPLE</span>
    </div>
    <div class="big"><span id="net">—</span><span class="unit">分钟<span class="en">Min</span></span></div>
    <p class="line" id="line"></p>
    <p class="line-en" id="line-en"></p>
    <button class="fix" id="fix" type="button" hidden>改为次日结束</button>
  </section>

  <section class="ledger" id="ledger" aria-label="休息表和本单扣除">
    <div class="ledger-head"><h2>休息表<span class="en">Breaks</span></h2><span class="r">本单扣（分）<span class="en">This job (min)</span></span></div>
    <ul id="rows"></ul>
    <div class="edit-bar" id="edit-bar">
      <button class="ghost" id="edit" type="button">改休息时间<span class="en">Edit breaks</span></button>
    </div>
    <div class="editor" id="editor" hidden>
      <div class="shift">
        <label for="on">上班<input class="time sm" id="on" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="815"></label>
        <label for="off">下班<input class="time sm" id="off" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="2030"></label>
      </div>
      <div class="ed-btns">
        <button class="ghost" id="add" type="button">＋ 加一段</button>
        <button class="ghost" id="reset" type="button">恢复默认</button>
        <button class="done" id="done" type="button">完成</button>
      </div>
      <p class="ed-note" id="ed-note"></p>
    </div>
  </section>

  <p class="foot" id="foot">上班 08:15 · 下班 20:30 · 只扣和起止时间重叠的部分</p>
</main>

<script>
const CO = (() => {
  // 默认就是我们车间那套；每部手机可以在「改休息时间」里改成自己的，存在那部手机上。
  const DEFAULTS = {
    on: 495,    // 08:15 上班
    off: 1230,  // 20:30 下班
    breaks: [
      { s: 600,  e: 610,  name: '休息' },   // 10:00-10:10
      { s: 690,  e: 730,  name: '午饭' },   // 11:30-12:10
      { s: 900,  e: 910,  name: '休息' },   // 15:00-15:10
      { s: 1080, e: 1110, name: '晚饭' }    // 18:00-18:30
    ]
  };
  const DAY = 1440;
  const MAX_BREAKS = 12;
  const EN = { '休息': 'Break', '茶歇': 'Break', '午饭': 'Lunch', '午餐': 'Lunch', '晚饭': 'Dinner', '晚餐': 'Dinner',
               '早饭': 'Breakfast', '早餐': 'Breakfast', '夜宵': 'Supper', '宵夜': 'Supper', '开会': 'Meeting' };
  const nameEn = n => EN[n] || 'Break';

  const copy = r => ({ on: r.on, off: r.off, breaks: r.breaks.map(b => ({ s: b.s, e: b.e, name: b.name })) });
  const isMin = v => Number.isInteger(v) && v >= 0 && v < DAY;
  // 只认对的规则：时间都在一天之内，结束比开始晚，下班比上班晚。
  function valid(r) {
    return !!r && isMin(r.on) && isMin(r.off) && r.off > r.on && Array.isArray(r.breaks) && r.breaks.length <= MAX_BREAKS &&
      r.breaks.every(b => b && isMin(b.s) && isMin(b.e) && b.e > b.s && typeof b.name === 'string' && b.name.length <= 12);
  }
  const sortBreaks = r => { r.breaks.sort((a, b) => a.s - b.s || a.e - b.e); return r; };
  let rules = copy(DEFAULTS);
  function setRules(r) {
    if (!valid(r)) return false;
    rules = sortBreaks(copy(r));
    return true;
  }
  const getRules = () => copy(rules);
  const isDefault = () => JSON.stringify(rules) === JSON.stringify(sortBreaks(copy(DEFAULTS)));

  const pad = n => String(n).padStart(2, '0');
  const fmt = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  const overlap = (a1, a2, b1, b2) => Math.max(0, Math.min(a2, b2) - Math.max(a1, b1));

  // As-you-type mask: digits only, colon after the hour. 0/1/2 start a two-digit hour, 3-9 a one-digit hour.
  function maskTime(raw) {
    const d = String(raw == null ? '' : raw).replace(/\D/g, '');
    if (!d) return '';
    const hl = d[0] >= '3' ? 1 : 2;
    if (d.length <= hl) return d;
    return d.slice(0, hl) + ':' + d.slice(hl, hl + 2);
  }

  // Minutes since midnight; null = empty or still being typed; NaN = unreadable.
  function parseTime(raw, final) {
    const s = String(raw == null ? '' : raw).trim();
    if (!s) return null;
    const sep = /[:.：。,，\s]+/;
    let h, m;
    if (sep.test(s)) {
      const parts = s.split(sep);
      if (parts.length !== 2) return NaN;
      const a = parts[0], b = parts[1];
      if (b === '') return final ? NaN : null;
      if (!/^\d{1,2}$/.test(a) || !/^\d{1,2}$/.test(b)) return NaN;
      if (b.length === 1) return final ? NaN : null;
      h = +a; m = +b;
    } else {
      if (!/^\d{1,4}$/.test(s)) return NaN;
      if (s.length <= 2) {
        if (!final) return null;
        h = +s; m = 0;
      } else if (s.length === 3) {
        h = +s[0]; m = +s.slice(1);
      } else {
        h = +s.slice(0, 2); m = +s.slice(2);
      }
    }
    if (h > 23 || m > 59) return NaN;
    return h * 60 + m;
  }

  // S, E in minutes since midnight; days = midnights crossed (0 = same day).
  // Breaks are deducted only where they overlap the job; overnight off -> next day's on is skipped.
  // Overlapping breaks are merged first, so a minute is never deducted twice.
  function compute(S, E, days) {
    const end = E + days * DAY;
    if (end < S) return null;
    const gross = end - S;
    let taken = [];                                   // 已经扣过的区间（同一分钟只扣一次）
    const take = (a, b) => {
      let t = 0;
      a = Math.max(a, S); b = Math.min(b, end);
      if (b <= a) return 0;
      const pieces = [[a, b]];
      for (const [x, y] of taken) {
        for (let i = pieces.length - 1; i >= 0; i--) {
          const [p, q] = pieces[i];
          if (y <= p || x >= q) continue;
          pieces.splice(i, 1, ...[[p, Math.min(q, x)], [Math.max(p, y), q]].filter(([u, v]) => v > u));
        }
      }
      for (const [p, q] of pieces) { t += q - p; taken.push([p, q]); }
      return t;
    };
    const breaks = rules.breaks.map(b => {
      let t = 0;
      for (let d = 0; d <= days; d++) t += take(b.s + d * DAY, b.e + d * DAY);
      return t;
    });
    let night = 0;
    for (let d = 0; d < days; d++) night += take(rules.off + d * DAY, rules.on + (d + 1) * DAY);
    const net = gross - night - breaks.reduce((a, b) => a + b, 0);
    return { gross, breaks, night, net };
  }

  function hm(m) {
    if (m < 60) return m + ' 分';
    const h = Math.floor(m / 60), r = m % 60;
    return r ? h + ' 小时 ' + r + ' 分' : h + ' 小时';
  }

  function hmEn(m) {
    if (m < 60) return m + ' min';
    const h = Math.floor(m / 60), r = m % 60;
    return r ? h + ' hr ' + r + ' min' : h + ' hr';
  }

  return { DEFAULTS: copy(DEFAULTS), MAX_BREAKS, valid, setRules, getRules, isDefault, nameEn,
           fmt, parseTime, compute, hm, hmEn, maskTime };
})();
</script>

<script>
(() => {
  const KEY = 'co-calc-v1';
  const RULES_KEY = 'co-calc-rules-v1';
  const $ = id => document.getElementById(id);
  const startEl = $('start'), endEl = $('end'), nextEl = $('next');
  const netEl = $('net'), lineEl = $('line'), lineEnEl = $('line-en'), fixEl = $('fix'), chipEl = $('chip'), rowsEl = $('rows');
  const ledgerEl = $('ledger'), editBarEl = $('edit-bar'), editorEl = $('editor'), onEl = $('on'), offEl = $('off');
  const noteEl = $('ed-note'), footEl = $('foot');
  let example = false;
  let draft = null;           // 正在改的休息表：{on, off, rows: [{s, e, name}]}，都是框里的字

  function load(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return s && typeof s === 'object' ? s : null;
    } catch (e) { return null; }
  }
  function save() {
    if (example) return;
    try {
      localStorage.setItem(KEY, JSON.stringify({ start: startEl.value, end: endEl.value, next: nextEl.checked }));
    } catch (e) {}
  }
  function saveRules() {
    try {
      if (CO.isDefault()) localStorage.removeItem(RULES_KEY);
      else localStorage.setItem(RULES_KEY, JSON.stringify(CO.getRules()));
    } catch (e) {}
  }
  function userEdit() {
    if (!example) return;
    example = false;
    chipEl.hidden = true;
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function renderRows(res, days) {
    if (draft) return;                                   // 正在改：框子别被刷掉
    const r = CO.getRules();
    const items = r.breaks.map((b, i) => ({
      t: CO.fmt(b.s) + '–' + CO.fmt(b.e),
      n: b.name || '休息',
      en: CO.nameEn(b.name || '休息'),
      v: res ? res.breaks[i] : 0
    }));
    if (days) items.push({
      t: CO.fmt(r.off) + '–' + CO.fmt(r.on),
      n: '下班 → 次日上班',
      en: 'Off → next shift',
      v: res ? res.night : 0
    });
    rowsEl.innerHTML = items.length ? items.map(it =>
      '<li class="' + (it.v > 0 ? 'on' : 'off') + '">' +
        '<span class="t">' + it.t + '</span>' +
        '<span class="n">' + esc(it.n) + '<span class="en">' + it.en + '</span></span>' +
        '<span class="v">' + (it.v > 0 ? '−' + it.v : '—') + '</span>' +
      '</li>'
    ).join('') : '<li class="off"><span class="t">—</span><span class="n">没有休息<span class="en">No breaks</span></span><span class="v">—</span></li>';
  }

  function renderFoot() {
    const r = CO.getRules();
    footEl.textContent = '上班 ' + CO.fmt(r.on) + ' · 下班 ' + CO.fmt(r.off) + ' · 只扣和起止时间重叠的部分' +
      (CO.isDefault() ? '' : ' · 休息表是这台手机自己改的');
  }

  function render() {
    const S = CO.parseTime(startEl.value, document.activeElement !== startEl);
    const E = CO.parseTime(endEl.value, document.activeElement !== endEl);
    const days = nextEl.checked ? 1 : 0;
    startEl.setAttribute('aria-invalid', Number.isNaN(S) ? 'true' : 'false');
    endEl.setAttribute('aria-invalid', Number.isNaN(E) ? 'true' : 'false');
    fixEl.hidden = true;
    lineEnEl.textContent = '';
    let res = null;

    if (Number.isNaN(S) || Number.isNaN(E)) {
      netEl.textContent = '—';
      lineEl.textContent = (Number.isNaN(S) ? '开始' : '结束') + '时间看不懂，直接打数字，比如 830 或 1321。';
    } else if (S === null || E === null) {
      netEl.textContent = '—';
      lineEl.textContent = S === null && E === null ? '填开始和结束时间。'
        : S === null ? '还差开始时间。'
        : '还差结束时间，收工时按「现在」。';
    } else {
      res = CO.compute(S, E, days);
      if (!res) {
        netEl.textContent = '—';
        lineEl.textContent = '结束早于开始。第二天才收尾的话：';
        fixEl.hidden = false;
      } else {
        netEl.textContent = String(res.net);
        lineEl.textContent = CO.hm(res.net) + ' · 毛时长 ' + res.gross + ' 分，扣 ' + (res.gross - res.net) + ' 分';
        lineEnEl.textContent = CO.hmEn(res.net) + ' · ' + res.gross + ' min from start to end, minus ' + (res.gross - res.net);
      }
    }
    renderRows(res, days);
    renderFoot();
  }

  // ---------------------------------------------------------------- 改休息时间（就在休息表里原地改）
  const toDraft = r => ({
    on: CO.fmt(r.on), off: CO.fmt(r.off),
    rows: r.breaks.map(b => ({ s: CO.fmt(b.s), e: CO.fmt(b.e), name: b.name }))
  });

  // 框里的字变成规则。空着的一行不算；有毛病的框记下来（标红、说一声）。
  function readDraft() {
    const bad = [];
    const rule = { on: CO.parseTime(draft.on, true), off: CO.parseTime(draft.off, true), breaks: [] };
    const okTime = v => typeof v === 'number' && !Number.isNaN(v);
    if (!okTime(rule.on)) bad.push({ el: onEl, why: '上班时间看不懂' });
    if (!okTime(rule.off)) bad.push({ el: offEl, why: '下班时间看不懂' });
    if (okTime(rule.on) && okTime(rule.off) && rule.off <= rule.on) bad.push({ el: offEl, why: '下班要比上班晚' });
    draft.rows.forEach((row, i) => {
      if (!row.s.trim() && !row.e.trim()) return;        // 空行：不算
      const s = CO.parseTime(row.s, true), e = CO.parseTime(row.e, true);
      const sEl = rowsEl.querySelector('[data-i="' + i + '"][data-k="s"]');
      const eEl = rowsEl.querySelector('[data-i="' + i + '"][data-k="e"]');
      if (!okTime(s)) { bad.push({ el: sEl, why: '有一段的开始时间看不懂' }); return; }
      if (!okTime(e)) { bad.push({ el: eEl, why: '有一段的结束时间看不懂' }); return; }
      if (e <= s) { bad.push({ el: eEl, why: '有一段结束比开始早' }); return; }
      rule.breaks.push({ s, e, name: row.name.trim() || '休息' });
    });
    if (rule.breaks.length > CO.MAX_BREAKS) bad.push({ el: null, why: '最多 ' + CO.MAX_BREAKS + ' 段' });
    return { rule, bad };
  }

  // 每改一个字：对的就马上用上、存进手机（不用点保存）；不对的标红，结果先按上一次对的算。
  function applyDraft(final) {
    const { rule, bad } = readDraft();
    editorEl.querySelectorAll('[aria-invalid]').forEach(el => el.setAttribute('aria-invalid', 'false'));
    rowsEl.querySelectorAll('[aria-invalid]').forEach(el => el.setAttribute('aria-invalid', 'false'));
    const shown = bad.filter(b => final || !b.el || b.el !== document.activeElement);
    shown.forEach(b => b.el && b.el.setAttribute('aria-invalid', 'true'));
    if (!bad.length && CO.setRules(rule)) {
      saveRules();
      noteEl.className = 'ed-note';
      noteEl.textContent = '改了马上算数，只存在这台手机上。';
    } else if (shown.length) {
      noteEl.className = 'ed-note bad';
      noteEl.textContent = shown[0].why + '。直接打数字，比如 1000 就是 10:00。';
    }
    render();
    return bad;
  }

  function drawEditor(focusRow) {
    rowsEl.innerHTML = draft.rows.map((row, i) =>
      '<li class="ed">' +
        '<input class="time sm" data-i="' + i + '" data-k="s" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="开始" aria-label="第 ' + (i + 1) + ' 段开始" value="' + esc(row.s) + '">' +
        '<span class="dash">–</span>' +
        '<input class="time sm" data-i="' + i + '" data-k="e" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="结束" aria-label="第 ' + (i + 1) + ' 段结束" value="' + esc(row.e) + '">' +
        '<input class="name" data-i="' + i + '" data-k="name" type="text" maxlength="6" placeholder="休息" aria-label="第 ' + (i + 1) + ' 段叫什么" value="' + esc(row.name) + '">' +
        '<button class="del" data-i="' + i + '" type="button" aria-label="删掉第 ' + (i + 1) + ' 段">×</button>' +
      '</li>'
    ).join('');
    onEl.value = draft.on;
    offEl.value = draft.off;
    $('add').disabled = draft.rows.length >= CO.MAX_BREAKS;
    if (focusRow != null) {
      const el = rowsEl.querySelector('[data-i="' + focusRow + '"][data-k="s"]');
      if (el) el.focus();
    }
  }

  function openEditor() {
    draft = toDraft(CO.getRules());
    ledgerEl.classList.add('editing');
    editBarEl.hidden = true;
    editorEl.hidden = false;
    noteEl.className = 'ed-note';
    noteEl.textContent = '改了马上算数，只存在这台手机上。';
    drawEditor();
  }

  function closeEditor() {
    draft.rows = draft.rows.filter(r => r.s.trim() || r.e.trim());   // 空行扔掉
    const bad = applyDraft(true);
    if (bad.length) {
      drawEditor();
      applyDraft(true);
      const first = bad.find(b => b.el && b.el.isConnected) || bad[0];
      const again = first && first.el && (first.el.dataset.i != null
        ? rowsEl.querySelector('[data-i="' + first.el.dataset.i + '"][data-k="' + first.el.dataset.k + '"]') : first.el);
      if (again) again.focus();
      return;
    }
    draft = null;
    ledgerEl.classList.remove('editing');
    editorEl.hidden = true;
    editBarEl.hidden = false;
    render();
  }

  // 点进时间框就整格选中，直接打新数字（框是满的，不选中就打不进去）；iOS 要等一下再选一次
  function selectAll(el) {
    try { el.select(); } catch (x) {}
    const before = el.value;                             // 已经开始打字了就别再选，不然把刚打的字吃掉
    setTimeout(() => {
      if (document.activeElement === el && el.value === before) { try { el.setSelectionRange(0, el.value.length); } catch (x) {} }
    }, 0);
  }

  function timeInput(el, set) {
    const masked = CO.maskTime(el.value);
    if (masked !== el.value) {
      el.value = masked;
      try { el.setSelectionRange(masked.length, masked.length); } catch (e) {}
    }
    set(el.value);
    applyDraft(false);
  }
  function timeBlur(el, set) {
    const v = CO.parseTime(el.value, true);
    if (typeof v === 'number' && !Number.isNaN(v)) el.value = CO.fmt(v);
    set(el.value);
    applyDraft(true);
  }

  rowsEl.addEventListener('input', e => {
    const el = e.target;
    if (!draft || el.dataset.i == null) return;
    const row = draft.rows[+el.dataset.i];
    if (el.dataset.k === 'name') { row.name = el.value; applyDraft(false); }
    else timeInput(el, v => { row[el.dataset.k] = v; });
  });
  rowsEl.addEventListener('focusout', e => {
    const el = e.target;
    if (!draft || el.dataset.i == null || el.dataset.k === 'name' || !el.isConnected) return;
    timeBlur(el, v => { draft.rows[+el.dataset.i][el.dataset.k] = v; });
  });
  rowsEl.addEventListener('focusin', e => {
    const el = e.target;
    if (draft && el.classList.contains('time')) selectAll(el);
  });
  rowsEl.addEventListener('click', e => {
    const btn = e.target.closest('.del');
    if (!draft || !btn) return;
    draft.rows.splice(+btn.dataset.i, 1);
    drawEditor();
    applyDraft(true);
  });
  [[onEl, 'on'], [offEl, 'off']].forEach(([el, k]) => {
    el.addEventListener('input', () => timeInput(el, v => { draft[k] = v; }));
    el.addEventListener('blur', () => { if (draft) timeBlur(el, v => { draft[k] = v; }); });
    el.addEventListener('focus', () => selectAll(el));
  });
  $('edit').addEventListener('click', openEditor);
  $('add').addEventListener('click', () => {
    if (draft.rows.length >= CO.MAX_BREAKS) return;
    draft.rows.push({ s: '', e: '', name: '' });
    drawEditor(draft.rows.length - 1);
  });
  $('reset').addEventListener('click', () => {
    draft = toDraft(CO.DEFAULTS);
    drawEditor();
    applyDraft(true);
  });
  $('done').addEventListener('click', closeEditor);

  // ---------------------------------------------------------------- 开始、结束
  [startEl, endEl].forEach(el => {
    el.addEventListener('focus', () => selectAll(el));
    el.addEventListener('input', () => {
      const masked = CO.maskTime(el.value);
      if (masked !== el.value) {
        el.value = masked;
        try { el.setSelectionRange(masked.length, masked.length); } catch (e) {}
      }
      userEdit();
      render();
      save();
    });
    el.addEventListener('blur', () => {
      const v = CO.parseTime(el.value, true);
      if (typeof v === 'number' && !Number.isNaN(v)) el.value = CO.fmt(v);
      render();
      save();
    });
    el.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (el === startEl) endEl.focus(); else el.blur();
    });
  });

  document.querySelectorAll('.now').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = new Date();
      const el = btn.dataset.for === 'start' ? startEl : endEl;
      userEdit();
      el.value = CO.fmt(d.getHours() * 60 + d.getMinutes());
      if (el === startEl) {
        // Starting a new job: clear the old finish.
        endEl.value = '';
        nextEl.checked = false;
      }
      render();
      save();
    });
  });

  nextEl.addEventListener('change', () => { userEdit(); render(); save(); });
  fixEl.addEventListener('click', () => { nextEl.checked = true; userEdit(); render(); save(); });

  const rules = load(RULES_KEY);
  if (rules) CO.setRules(rules);                        // 存坏了就当没存，用默认
  const saved = load(KEY);
  if (saved) {
    startEl.value = typeof saved.start === 'string' ? saved.start : '';
    endEl.value = typeof saved.end === 'string' ? saved.end : '';
    nextEl.checked = !!saved.next;
  } else {
    startEl.value = '08:30';
    endEl.value = '13:21';
    example = true;
    chipEl.hidden = false;
  }
  render();
})();
</script>
</body>
</html>
